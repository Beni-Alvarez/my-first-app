services:
  db:
    image: postgres:16-alpine
    container_name: song-lyrics-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: songs
      POSTGRES_PASSWORD: songs
      POSTGRES_DB: songs
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
