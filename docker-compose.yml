services:
  db:
    image: postgres:16-alpine
    container_name: song-lyrics-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: songs
      POSTGRES_PASSWORD: songs
      POSTGRES_DB: songs
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates the songs_test database on first start (see docker/postgres-init.sql).
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql:ro

volumes:
  db-data:
